#
#  Minimal radiusd.conf for testing SRADIUS
#
raddb        = raddb
modconfdir   = ${raddb}/mods-config
pidfile      = ${testdir}/radiusd.pid
panic_action = "gdb -batch -x $${testdir}/panic.gdb %e %p > $${testdir}/gdb-radiusd.log 2>&1; cat $${testdir}/gdb-radiusd.log"

$INCLUDE vars.conf

#  Only for testing!
#  Setting this on a production system is a BAD IDEA.
security {
	allow_vulnerable_openssl = no
}

thread pool {
	start_servers = 5
	max_servers = 32
	min_spare_servers = 3
	max_spare_servers = 10
	max_requests_per_server = 0
	cleanup_delay = 5
	max_queue_size = 65536
	auto_limit_acct = no
}

#
#  References by some modules for default thread pool configuration
#
modules {
	$INCLUDE ${raddb}/mods-enabled/always
	$INCLUDE ${raddb}/mods-enabled/pap
	$INCLUDE ${raddb}/mods-enabled/expr
}

#
# Minimum configuration for Proxy Server -> SRADIUSD
#
home_server sradius {
	ipaddr = 127.0.0.1
	port = ${port_sradiusd_auth}
	type = auth
	secret = radsec
	proto = tcp
	status_check = none
	sradius = yes
	tls {
		private_key_password = whatever
		private_key_file = ${certdir}/client.pem
		certificate_file = ${certdir}/client.pem
		ca_file = ${cadir}/ca.pem
		fragment_size = 8192
		ca_path = ${cadir}
		cipher_list = "DEFAULT"
	}
}

home_server_pool sradius {
	type = fail-over
	home_server = sradius
}

client local_test {
	ipaddr = 127.0.0.1
	secret = testing123
	proto = *
}

listen {
	type = auth
	ipaddr = 127.0.0.1
	port = ${port_radiusd_auth}
	proto = udp
	virtual_server = radiusd_proxy
}

server radiusd_proxy {
	authorize {
		if (!Proxy-State) {
			update control {
				&Home-Server-Name = "sradius"
			}
			return
		}
	}

	authenticate {

	}

	pre-proxy {

	}

	post-proxy {

	}
}
