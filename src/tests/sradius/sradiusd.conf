#
#  Minimal sradiusd.conf for testing SRADIUS
#
raddb        = raddb
modconfdir   = ${raddb}/mods-config
pidfile      = ${testdir}/sradiusd.pid
panic_action = "gdb -batch -x $${testdir}/panic.gdb %e %p > $${testdir}/gdb-sradiusd.log 2>&1; cat $${testdir}/gdb-sradiusd.log"

$INCLUDE vars.conf

#  Only for testing!
#  Setting this on a production system is a BAD IDEA.
security {
	allow_vulnerable_openssl = no
}

correct_escapes	= true

thread pool {
	start_servers = 5
	max_servers = 32
	min_spare_servers = 3
	max_spare_servers = 10
	max_requests_per_server = 0
	cleanup_delay = 5
	max_queue_size = 65536
	auto_limit_acct = no
}

#
#  References by some modules for default thread pool configuration
#
modules {
	$INCLUDE ${raddb}/mods-enabled/always
	$INCLUDE ${raddb}/mods-enabled/pap
	$INCLUDE ${raddb}/mods-enabled/expr
}

policy {
	$INCLUDE ${raddb}/policy.d/
}

#
# Minimum configuration for Proxy Server -> SRADIUSD
#
clients sradius {
	client 127.0.0.1 {
		ipaddr = 127.0.0.1
		proto = tls
		secret = radsec
		sradius = yes
	}
	sradius = yes
}

listen {
	ipaddr = *
	port = ${port_sradiusd_auth}
	type = auth+acct
	proto = tcp

	limit {
	      max_connections = 16
	      lifetime = 0
	      idle_timeout = 30
	}

	tls {
		private_key_password = whatever
		private_key_file = ${certdir}/server.pem
		certificate_file = ${certdir}/server.pem
		ca_file = ${cadir}/ca.pem
		fragment_size = 8192
		ca_path = ${cadir}
		ca_path_reload_interval = 3600
		cipher_list = "DEFAULT"
		cipher_server_preference = no
		tls_min_version = "1.3"
		tls_max_version = "1.3"

		cache {
		      enable = no
		}

		require_client_cert = yes

		verify {
		}
	}

	virtual_server = sradius
	clients = sradius
	sradius = yes
}

server sradius {
	authorize {
		if (&User-Name == "sradius") {
			accept
		} else {
			reject
		}
	}

	authenticate {

	}

	pre-proxy {

	}

	post-proxy {

	}
}
